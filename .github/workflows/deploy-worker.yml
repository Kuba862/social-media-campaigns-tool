# Deploys the Temporal worker to Cloud Run without connecting the repository to Cloud Build:
# GitHub signs in to GCP with Workload Identity Federation and submits cloudbuild.yaml.
# Enabled by the repository variable DEPLOY_WORKER=true; the other values are repository
# variables too (none of them is a secret; secrets live in Secret Manager).
name: deploy-worker

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - backend/**
      - cloudbuild.yaml
      - .github/workflows/deploy-worker.yml

jobs:
  deploy:
    if: vars.DEPLOY_WORKER == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and deploy through Cloud Build
        run: |
          gcloud builds submit --config cloudbuild.yaml --region "${{ vars.GCP_REGION }}" \
            --substitutions "^|^_REGION=${{ vars.GCP_REGION }}|_TEMPORAL_ADDRESS=${{ vars.TEMPORAL_ADDRESS }}|_TEMPORAL_NAMESPACE=${{ vars.TEMPORAL_NAMESPACE }}|_SUPABASE_URL=${{ vars.SUPABASE_URL }}|_WA_ALLOWED_TEST_RECIPIENTS=${{ vars.WA_ALLOWED_TEST_RECIPIENTS }}" \
            .
