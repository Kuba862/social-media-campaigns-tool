[project]
name = "wa-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.41",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "temporalio>=1.34.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "uvicorn>=0.54.0",
]

[tool.vercel]
# Vercel's FastAPI preset: Python from .python-version, dependencies from uv.lock, all requests
# to this ASGI app (docs/deploy-vercel.md).
entrypoint = "api.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
